<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="커뮤니티 게시판을 찾고 즐겨찾는 CommunityViewer 웹버전">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>CommunityViewer</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">C</span><span>CommunityViewer</span></div>
      <span class="web-label">WEB</span>
    </header>
    <main id="app" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button data-tab="favorites" class="nav-button" type="button"><span class="nav-icon">⌂</span><span>즐겨찾기</span></button>
      <button data-tab="explore" class="nav-button" type="button"><span class="nav-icon">◎</span><span>커뮤니티</span></button>
      <button data-tab="settings" class="nav-button" type="button"><span class="nav-icon">⋯</span><span>더보기</span></button>
    </nav>
  </div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
